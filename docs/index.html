<!DOCTYPE HTML>
<!--
	YourDailyPulse Hub
    - Redirects to the live Firebase App.
    - Provides access to Documentation.
-->
<html>
	<head>
		<title>YourDailyPulse | Redirecting...</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        
        <!-- 1. ZÁLOŽNÉ PRESMEROVANIE (META TAG) - 12 sekúnd (rezerva, ak by zlyhal JS) -->
        <meta http-equiv="refresh" content="7;url=https://key-perigee-474220-u3.web.app/index.html" />

        <!-- 2. VIZUÁL: Ťaháme štýly z ostrej verzie, aby to ladilo -->
		<link rel="stylesheet" href="https://key-perigee-474220-u3.web.app/assets/css/main.css" />
		<noscript><link rel="stylesheet" href="https://key-perigee-474220-u3.web.app/assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Sidebar (Len vizuál) -->
			<section id="sidebar">
				<div class="inner">
					<nav>
						<ul>
							<li><a href="#">Redirecting...</a></li>
                            <!-- Odkaz na dokumentáciu -->
                            <li><a href="documentation.html" target="_blank" style="color: #aaa;">Developer Docs <i class="fas fa-external-link-alt" style="font-size: 0.8em;"></i></a></li>
						</ul>
					</nav>
				</div>
			</section>

		<!-- Wrapper -->
			<div id="wrapper">
					<section id="intro" class="wrapper style1 fullscreen fade-up">
						<div class="inner">
							<h1>YourDailyPulse</h1>
							
                            <!-- Odpočítavanie -->
							<p style="font-size: 1.3em;">
                                Redirecting to the application in <span id="countdown" style="color: #b74e91; font-weight: bold;">5</span> seconds...
                            </p>
                            
							<ul class="actions">
                                <!-- Tlačidlo 1: Okamžité presmerovanie -->
								<li><a href="https://key-perigee-474220-u3.web.app/index.html" class="button primary">Open App Now</a></li>
                                
                                <!-- Tlačidlo 2: Dokumentácia v NOVOM OKNE (target="_blank") -->
                                <!-- Vďaka target="_blank" táto stránka ostane otvorená a odpočet dobehne -->
                                <li><a href="documentation.html" target="_blank" class="button">Read Documentation</a></li>
							</ul>
						</div>
					</section>
			</div>

        <!-- 3. LOGIKA ODPOČÍTAVANIA -->
        <script>
            // Nastavenie času (v sekundách)
            var secondsLeft = 5;
            var targetUrl = "https://key-perigee-474220-u3.web.app/index.html";
            var countdownElement = document.getElementById('countdown');

            // Funkcia, ktorá sa spustí každú sekundu
            var countdownInterval = setInterval(function() {
                secondsLeft--;
                
                // Aktualizácia čísla na obrazovke
                if (countdownElement) {
                    countdownElement.textContent = secondsLeft;
                }

                // Keď čas vyprší
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    window.location.href = targetUrl;
                }
            }, 1000); // 1000 ms = 1 sekunda
        </script>

        <!-- Načítanie skriptov pre vizuálne efekty -->
        <script src="https://key-perigee-474220-u3.web.app/assets/js/jquery.min.js"></script>
        <script src="https://key-perigee-474220-u3.web.app/assets/js/browser.min.js"></script>
        <script src="https://key-perigee-474220-u3.web.app/assets/js/breakpoints.min.js"></script>
        <script src="https://key-perigee-474220-u3.web.app/assets/js/util.js"></script>
        <script src="https://key-perigee-474220-u3.web.app/assets/js/main.js"></script>

	</body>
</html>
